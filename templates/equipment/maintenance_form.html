{% extends "base.html" %}
{% block title %}Record Maintenance - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Record Maintenance</h1>
        <p class="text-sm text-gray-500 mt-1">Log maintenance activity for {{ equipment.name }}</p>
    </div>

    <form method="post" class="bg-white rounded-2xl border border-gray-200 p-6 space-y-5">
        {% csrf_token %}
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Type <span class="text-red-500">*</span></label>
                <select name="maintenance_type" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                    <option value="scheduled">Scheduled</option>
                    <option value="repair">Repair</option>
                    <option value="inspection">Inspection</option>
                    <option value="calibration">Calibration</option>
                    <option value="cleaning">Cleaning</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Date <span class="text-red-500">*</span></label>
                <input type="date" name="performed_date" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Description <span class="text-red-500">*</span></label>
            <textarea name="description" required rows="3" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 resize-y" placeholder="Describe the maintenance performed..."></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Vendor / Service Provider</label>
                <input type="text" name="vendor" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="e.g. Camera Repair Lagos">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Cost (NGN)</label>
                <input type="number" name="cost" step="0.01" min="0" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20" placeholder="0.00">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Next Maintenance Date</label>
            <input type="date" name="next_due_date" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20">
            <p class="text-xs text-gray-400 mt-1">When should this equipment be serviced next?</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Notes</label>
            <textarea name="notes" rows="2" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 resize-y" placeholder="Any additional notes..."></textarea>
        </div>

        <div class="flex items-center gap-3 pt-2">
            <button type="submit" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-brand-700 transition-all shadow-sm shadow-brand-600/25">
                Save Maintenance Log
            </button>
            <a href="{% url 'equipment:detail' pk=equipment.pk %}" class="text-gray-500 px-4 py-2.5 rounded-xl text-sm font-medium hover:bg-gray-100 transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
