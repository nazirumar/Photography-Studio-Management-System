{% extends "base.html" %}
{% block title %}Delete Confirmation - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="bg-white rounded-2xl border border-gray-200 p-8 text-center">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900 mb-2">Delete {{ title }}</h2>
        <p class="text-gray-500 text-sm mb-6">Are you sure you want to delete <strong>{{ item_name }}</strong>? This action cannot be undone.</p>
        <form method="post" class="flex gap-3 justify-center">
            {% csrf_token %}
            <a href="{{ cancel_url }}" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-xl hover:bg-gray-200 text-sm font-medium transition">Cancel</a>
            <button type="submit" class="bg-red-600 text-white px-6 py-2.5 rounded-xl hover:bg-red-700 text-sm font-medium transition shadow-sm shadow-red-600/25">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
