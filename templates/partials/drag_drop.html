{# Drag and drop reordering component #}
{# Usage: <div hx-post="{% url 'reorder_url' %}" hx-trigger="end" hx-swap="none" class="sortable"> #}

<style>
.sortable { min-height: 50px; }
.sortable-item { cursor: grab; transition: all 0.2s; }
.sortable-item:active { cursor: grabbing; }
.sortable-item.dragging { opacity: 0.5; background: #eef2ff; border: 2px dashed #6366f1; }
.sortable-item.over { border-top: 2px solid #6366f1; }
</style>

<script>
function initSortable(container) {
    let draggedItem = null;

    container.addEventListener('dragstart', (e) => {
        if (e.target.classList.contains('sortable-item')) {
            draggedItem = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
    });

    container.addEventListener('dragend', (e) => {
        if (e.target.classList.contains('sortable-item')) {
            e.target.classList.remove('dragging');
            draggedItem = null;
            saveOrder(container);
        }
    });

    container.addEventListener('dragover', (e) => {
        e.preventDefault();
        const afterElement = getDragAfterElement(container, e.clientY);
        if (draggedItem) {
            if (afterElement == null) {
                container.appendChild(draggedItem);
            } else {
                container.insertBefore(draggedItem, afterElement);
            }
        }
    });

    container.addEventListener('dragenter', (e) => {
        if (e.target.classList.contains('sortable-item')) {
            e.target.classList.add('over');
        }
    });

    container.addEventListener('dragleave', (e) => {
        if (e.target.classList.contains('sortable-item')) {
            e.target.classList.remove('over');
        }
    });
}

function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('.sortable-item:not(.dragging)')];
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function saveOrder(container) {
    const items = [...container.querySelectorAll('.sortable-item')];
    const order = items.map((item, index) => ({
        id: item.dataset.id,
        order: index
    }));

    const url = container.dataset.reorderUrl;
    if (url) {
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({ order: order })
        }).then(res => res.json()).then(data => {
            if (data.success && window.toast) {
                window.toast('Order updated', 'success');
            }
        });
    }
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}
</script>
