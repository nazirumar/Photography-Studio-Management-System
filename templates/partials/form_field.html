<div class="space-y-1.5">
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1.5">
        {{ field.label }}
        {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.errors %}
    <p class="text-red-500 text-xs mt-1.5">{{ field.errors.0 }}</p>
    {% endif %}
    {% if field.help_text %}
    <p class="text-gray-400 text-xs mt-1.5">{{ field.help_text }}</p>
    {% endif %}
</div>
