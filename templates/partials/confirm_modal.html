{# Reusable confirmation modal component #}
{# Usage: {% confirm_modal id="delete-booking" title="Delete Booking" message="Are you sure?" url=url %} #}
{% load form_filters %}

<div x-data="{ open: false }" @open-confirm-modal-{{ id }}.window="open = true" x-show="open" x-cloak class="fixed inset-0 z-50">
    <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm" @click="open = false" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
    <div class="fixed inset-0 flex items-center justify-center p-4" @click.self="open = false">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" @click.stop>
            <div class="text-center">
                <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4" :class="type === 'danger' ? 'bg-red-100' : type === 'warning' ? 'bg-amber-100' : 'bg-blue-100'">
                    <svg x-show="type === 'danger'" class="w-7 h-7 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    <svg x-show="type === 'warning'" class="w-7 h-7 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/></svg>
                    <svg x-show="type === 'info'" class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2" x-text="title"></h3>
                <p class="text-gray-500 text-sm mb-6" x-text="message"></p>
                <div class="flex gap-3 justify-center">
                    <button @click="open = false" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl hover:bg-gray-200 text-sm font-medium transition">Cancel</button>
                    <a :href="url" class="px-5 py-2.5 rounded-xl text-sm font-medium transition text-white shadow-sm"
                       :class="type === 'danger' ? 'bg-red-600 hover:bg-red-700 shadow-red-600/25' : type === 'warning' ? 'bg-amber-600 hover:bg-amber-700 shadow-amber-600/25' : 'bg-brand-600 hover:bg-brand-700 shadow-brand-600/25'"
                       x-text="confirmText || 'Confirm'"></a>
                </div>
            </div>
        </div>
    </div>
</div>
