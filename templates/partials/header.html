<!-- Header -->
<header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-gray-200/60">
    <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
        <!-- Left: Search -->
        <div class="flex items-center gap-4">
            <div class="relative hidden sm:block" x-data="search()">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <input type="text" placeholder="Search clients, bookings, invoices..."
                    x-model="query" @input.debounce.300ms="doSearch()" @keydown.escape="results = []" @focus="showResults = results.length > 0"
                    class="w-80 pl-10 pr-4 py-2 bg-gray-100 border-0 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:bg-white transition">
                <div x-show="showResults && results.length > 0" @click.away="showResults = false" x-cloak
                     class="absolute top-full left-0 mt-2 w-full bg-white rounded-xl shadow-xl border border-gray-200 py-2 z-50 max-h-96 overflow-y-auto">
                    <template x-for="r in results" :key="r.url">
                        <a :href="r.url" class="flex items-center gap-3 px-4 py-2.5 hover:bg-gray-50 transition">
                            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full text-xs font-bold"
                                  :class="{'bg-blue-100 text-blue-700': r.type==='client', 'bg-emerald-100 text-emerald-700': r.type==='booking', 'bg-amber-100 text-amber-700': r.type==='invoice', 'bg-purple-100 text-purple-700': r.type==='lead'}"
                                  x-text="r.type[0].toUpperCase()"></span>
                            <div class="min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate" x-text="r.title"></p>
                                <p class="text-xs text-gray-500 truncate" x-text="r.subtitle"></p>
                            </div>
                        </a>
                    </template>
                </div>
            </div>
        </div>

        <!-- Right: Actions -->
        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Dark mode toggle -->
            <button @click="$store.darkMode.toggle()" class="p-2.5 rounded-xl text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition">
                <svg x-show="!$store.darkMode.on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
                <svg x-show="$store.darkMode.on" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>

            <!-- Notifications -->
            <a href="{% url 'notifications:list' %}" class="relative p-2.5 rounded-xl text-gray-500 hover:text-gray-700 hover:bg-gray-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            </a>

            <!-- User menu -->
            <div x-data="{ open: false }" class="relative">
                <button @click="open = !open" @keydown.escape="open = false" class="flex items-center gap-3 p-1.5 rounded-xl hover:bg-gray-100 transition">
                    <div class="w-9 h-9 rounded-xl bg-brand-500 flex items-center justify-center text-white font-semibold text-sm">
                        {{ user.get_full_name|first|upper }}
                    </div>
                    <div class="hidden sm:block text-left">
                        <p class="text-sm font-medium text-gray-700">{{ user.get_full_name|default:user.email }}</p>
                        <p class="text-xs text-gray-500">Admin</p>
                    </div>
                    <svg class="w-4 h-4 text-gray-400 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div x-show="open" @click.away="open = false" x-cloak x-transition
                     class="absolute right-0 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-gray-200 py-2 z-50">
                    <div class="px-4 py-3 border-b border-gray-100">
                        <p class="text-sm font-semibold text-gray-900">{{ user.get_full_name|default:user.email }}</p>
                        <p class="text-xs text-gray-500 mt-0.5">{{ user.email }}</p>
                    </div>
                    <a href="{% url 'portal:dashboard' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        Client Portal
                    </a>
                    <a href="{% url 'reports:dashboard' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 transition">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2z"/></svg>
                        Reports
                    </a>
                    <div class="border-t border-gray-100 mt-1 pt-1">
                        <a href="{% url 'accounts:logout' %}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            Sign out
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
