{# Inline editing component #}
{# Usage: {% inline_edit field="title" value=booking.title url=url pk=booking.pk %} #}

<div x-data="inlineEdit('{{ field }}', '{{ value|escapejs }}', '{{ url }}', '{{ pk }}')" class="group relative">
    <div x-show="!editing" @click="editing = true" class="cursor-pointer hover:bg-gray-50 px-2 py-1 rounded transition">
        <span x-text="currentValue" class="text-sm">{{ value|default:"Click to edit" }}</span>
        <svg class="w-3 h-3 text-gray-400 opacity-0 group-hover:opacity-100 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
    </div>
    <div x-show="editing" x-cloak class="flex items-center gap-2">
        <input type="text" x-model="editValue" @keydown.enter="save()" @keydown.escape="cancel()" class="flex-1 px-2 py-1 text-sm border border-brand-300 rounded focus:outline-none focus:ring-2 focus:ring-brand-500/20">
        <button @click="save()" class="p-1 text-emerald-600 hover:bg-emerald-50 rounded">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
        </button>
        <button @click="cancel()" class="p-1 text-gray-500 hover:bg-gray-100 rounded">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
</div>

<script>
function inlineEdit(field, initialValue, url, pk) {
    return {
        editing: false,
        currentValue: initialValue,
        editValue: initialValue,
        async save() {
            const formData = new FormData();
            formData.append('field', field);
            formData.append('value', this.editValue);
            formData.append('pk', pk);
            formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]')?.value || '');

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    body: formData,
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const data = await res.json();
                if (data.success) {
                    this.currentValue = this.editValue;
                    this.editing = false;
                    if (window.toast) window.toast('Updated successfully', 'success');
                } else {
                    if (window.toast) window.toast(data.error || 'Update failed', 'error');
                }
            } catch(e) {
                if (window.toast) window.toast('Network error', 'error');
            }
        },
        cancel() {
            this.editValue = this.currentValue;
            this.editing = false;
        }
    };
}
</script>
