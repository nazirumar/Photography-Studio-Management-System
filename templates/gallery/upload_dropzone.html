{% extends "base.html" %}
{% block title %}Upload Photos - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Upload Photos</h1>
        <p class="text-gray-500 mt-1">Drag and drop or click to upload</p>
    </div>

    <div x-data="dropzone()" class="bg-white rounded-2xl border border-gray-200 p-8">
        <div class="border-2 border-dashed rounded-xl p-12 text-center transition-all"
             :class="isDragging ? 'border-brand-500 bg-brand-50' : 'border-gray-300 hover:border-brand-400'"
             @dragover.prevent="isDragging = true"
             @dragleave.prevent="isDragging = false"
             @drop.prevent="handleDrop($event)"
             @click="$refs.fileInput.click()">
            
            <svg class="w-12 h-12 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="text-gray-600 font-medium" x-text="isDragging ? 'Drop files here...' : 'Drag photos here or click to browse'"></p>
            <p class="text-gray-400 text-sm mt-1">Supports JPG, PNG, RAW up to 50MB each</p>
        </div>

        <input type="file" multiple accept="image/*" x-ref="fileInput" @change="handleFiles($event.target.files)" class="hidden">

        <!-- Upload progress -->
        <div x-show="files.length > 0" class="mt-6 space-y-3">
            <template x-for="(file, i) in files" :key="i">
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
                    <div class="w-10 h-10 rounded-lg bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-500" x-text="file.name.split('.').pop().toUpperCase()"></div>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-gray-900 truncate" x-text="file.name"></div>
                        <div class="text-xs text-gray-500" x-text="formatSize(file.size)"></div>
                    </div>
                    <div class="w-24">
                        <div class="w-full bg-gray-200 rounded-full h-1.5">
                            <div class="bg-brand-500 h-1.5 rounded-full transition-all" :style="'width: ' + (file.progress || 0) + '%'"></div>
                        </div>
                    </div>
                    <span class="text-xs text-gray-500" x-text="file.progress === 100 ? '✓' : (file.progress || 0) + '%'"></span>
                    <button @click="removeFile(i)" class="text-gray-400 hover:text-red-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </template>
            
            <div class="flex justify-between items-center pt-3">
                <span class="text-sm text-gray-500" x-text="files.length + ' file(s) selected'"></span>
                <button @click="uploadAll()" :disabled="uploading" class="bg-brand-600 text-white px-5 py-2 rounded-xl hover:bg-brand-700 text-sm font-medium disabled:opacity-50">
                    <span x-show="!uploading">Upload All</span>
                    <span x-show="uploading">Uploading...</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function dropzone() {
    return {
        files: [],
        isDragging: false,
        uploading: false,
        handleDrop(e) {
            this.isDragging = false;
            this.handleFiles(e.dataTransfer.files);
        },
        handleFiles(fileList) {
            for (const file of fileList) {
                if (file.type.startsWith('image/')) {
                    this.files.push({ name: file.name, size: file.size, progress: 0, file: file });
                }
            }
        },
        removeFile(i) { this.files.splice(i, 1); },
        formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        },
        async uploadAll() {
            this.uploading = true;
            for (const f of this.files) {
                const formData = new FormData();
                formData.append('photo', f.file);
                // Simulate progress
                for (let p = 0; p <= 100; p += 10) {
                    f.progress = p;
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            this.uploading = false;
            toast('Photos uploaded successfully!', 'success');
        }
    };
}
</script>
{% endblock %}
