{% extends "base.html" %}
{% block title %}{{ title }} - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">{{ title }}</h1></div>
    <div class="bg-white rounded-xl border border-gray-200 p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
            <div class="flex gap-3 pt-4">
                <button type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 text-sm font-medium">Save</button>
                <a href="{% url 'packages:categories' %}" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-200 text-sm font-medium">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
