{% extends "base.html" %}
{% load form_filters %}
{% block title %}Create Payment Link - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'payments:link_list' %}" class="text-sm text-gray-500 hover:text-brand-600 transition inline-flex items-center gap-1 mb-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back to Payment Links
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Create Payment Link</h1>
    </div>
    <form method="post" class="space-y-6">
        {% csrf_token %}
        <div class="bg-white rounded-2xl border border-gray-200 p-6">
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Client</label>
                    <select name="client_id" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition">
                        <option value="">Select a client</option>
                        {% for client in clients %}
                        <option value="{{ client.pk }}">{{ client.display_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Amount (N)</label>
                    <input type="number" name="amount" step="0.01" required placeholder="0.00"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                    <input type="text" name="description" placeholder="e.g. Wedding package deposit"
                        class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition">
                </div>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit" class="inline-flex items-center gap-2 bg-brand-600 text-white px-6 py-2.5 rounded-xl hover:bg-brand-700 transition-all text-sm font-medium shadow-sm shadow-brand-600/25">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                Create Link
            </button>
            <a href="{% url 'payments:link_list' %}" class="bg-gray-100 text-gray-700 px-6 py-2.5 rounded-xl hover:bg-gray-200 text-sm font-medium transition">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
