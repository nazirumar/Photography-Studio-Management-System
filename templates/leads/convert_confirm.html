{% extends "base.html" %}
{% block title %}Convert Lead - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-2xl border border-gray-200 p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Convert Lead to Client</h1>
        <p class="text-sm text-gray-500 mb-6">Convert <strong class="text-gray-900">{{ lead.name }}</strong> to a client? This will create a new client record and mark the lead as won.</p>
        <form method="post" class="flex gap-3">
            {% csrf_token %}
            <button type="submit" class="inline-flex items-center gap-2 bg-green-600 text-white px-5 py-2.5 rounded-xl hover:bg-green-700 transition-all text-sm font-medium">Convert</button>
            <a href="{% url 'leads:detail' pk=lead.pk %}" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-xl hover:bg-gray-200 text-sm font-medium">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
