{% extends "base.html" %}
{% block title %}Import Clients - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <a href="{% url 'core_export:clients_csv' %}" class="text-sm text-gray-500 hover:text-brand-600 transition inline-flex items-center gap-1 mb-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            Back to Export
        </a>
        <h1 class="text-2xl font-bold text-gray-900">Import Clients</h1>
    </div>
    <div class="bg-white rounded-2xl border border-gray-200 p-6">
        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">CSV File</label>
                <input type="file" name="file" accept=".csv" required
                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-xl file:border-0 file:text-sm file:font-medium file:bg-brand-50 file:text-brand-700 hover:file:bg-brand-100 file:cursor-pointer file:transition">
                <p class="text-xs text-gray-400 mt-1.5">Required columns: first_name, last_name. Optional: phone, email, city, state</p>
            </div>
            <button type="submit" class="inline-flex items-center gap-2 bg-brand-600 text-white px-6 py-2.5 rounded-xl hover:bg-brand-700 transition-all text-sm font-medium">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Import Clients
            </button>
        </form>
    </div>
</div>
{% endblock %}
