{% extends "base.html" %}
{% block title %}StudioFlow - Core{% endblock %}
{% block content %}
<div class="space-y-6">
    <h1 class="text-2xl font-bold text-gray-900">System Tools</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <a href="{% url 'core_export:export' %}" class="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-lg transition">
            <svg class="w-10 h-10 text-brand-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <h3 class="font-semibold text-gray-900">Export / Import</h3>
            <p class="text-sm text-gray-500 mt-1">CSV export and import for clients, bookings, invoices</p>
        </a>
        <a href="{% url 'core_backup:list' %}" class="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-lg transition">
            <svg class="w-10 h-10 text-brand-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <h3 class="font-semibold text-gray-900">Backups</h3>
            <p class="text-sm text-gray-500 mt-1">Create and restore database backups</p>
        </a>
        <a href="{% url 'bookings_conflicts:dashboard' %}" class="bg-white rounded-2xl border border-gray-200 p-6 hover:shadow-lg transition">
            <svg class="w-10 h-10 text-brand-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <h3 class="font-semibold text-gray-900">Booking Conflicts</h3>
            <p class="text-sm text-gray-500 mt-1">Check scheduling conflicts</p>
        </a>
    </div>
</div>
{% endblock %}
