<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudioFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --c-white: #ffffff; --c-gray-50: #f9fafb; --c-gray-100: #f3f4f6; --c-gray-200: #e5e7eb;
            --c-gray-300: #d1d5db; --c-gray-400: #9ca3af; --c-gray-500: #6b7280; --c-gray-600: #4b5563;
            --c-gray-700: #374151; --c-gray-800: #1f2937; --c-gray-900: #111827; --c-gray-950: #030712;
            --c-indigo-500: #6366f1; --c-brand-500: #6366f1; --c-brand-600: #4f46e5; --c-brand-700: #4338ca;
        }
        .dark {
            --c-white: #0f172a; --c-gray-50: #1e293b; --c-gray-100: #1e293b; --c-gray-200: #334155;
            --c-gray-300: #475569; --c-gray-400: #64748b; --c-gray-500: #94a3b8; --c-gray-600: #cbd5e1;
            --c-gray-700: #e2e8f0; --c-gray-800: #f1f5f9; --c-gray-900: #f8fafc; --c-gray-950: #ffffff;
            --c-indigo-500: #818cf8; --c-brand-500: #818cf8; --c-brand-600: #a5b4fc; --c-brand-700: #c7d2fe;
        }
        .bg-white { background-color: var(--c-white) !important; }
        .bg-gray-50 { background-color: var(--c-gray-50) !important; }
        .bg-gray-100 { background-color: var(--c-gray-100) !important; }
        .text-gray-400 { color: var(--c-gray-400) !important; }
        .text-gray-500 { color: var(--c-gray-500) !important; }
        .text-gray-600 { color: var(--c-gray-600) !important; }
        .text-gray-700 { color: var(--c-gray-700) !important; }
        .text-gray-900 { color: var(--c-gray-900) !important; }
        .text-brand-500 { color: var(--c-brand-500) !important; }
        .text-brand-600 { color: var(--c-brand-600) !important; }
        .border-gray-200 { border-color: var(--c-gray-200) !important; }
        .border-gray-300 { border-color: var(--c-gray-300) !important; }
        .focus\:bg-white:focus { background-color: var(--c-white) !important; }
        .hover\:bg-brand-700:hover { background-color: var(--c-brand-700) !important; }
        .hover\:text-brand-500:hover { color: var(--c-brand-500) !important; }
        .dark .shadow-xl { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4), 0 8px 10px -6px rgba(0,0,0,0.3) !important; }
        .placeholder-gray-400::placeholder { color: var(--c-gray-400) !important; }
        .bg-brand-500 { background-color: var(--c-brand-500) !important; }
        .bg-brand-600 { background-color: var(--c-brand-600) !important; }
        .shadow-brand-600\/25 { box-shadow: 0 1px 2px 0 rgba(79,70,229,0.25) !important; }
        .dark .shadow-brand-600\/25 { box-shadow: 0 1px 2px 0 rgba(129,140,248,0.25) !important; }
    </style>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center" x-data x-init="
    const dark = localStorage.getItem('darkMode') === 'true';
    if (dark) document.documentElement.classList.add('dark');
">
    <!-- Dark mode toggle -->
    <button @click="
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
    " class="fixed top-4 right-4 p-2.5 rounded-xl text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition z-50">
        <svg x-show="!document.documentElement.classList.contains('dark')" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        <svg x-show="document.documentElement.classList.contains('dark')" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    </button>

    <div class="w-full max-w-md px-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
            <div class="text-center mb-8">
                <svg class="w-12 h-12 text-brand-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                <h1 class="text-2xl font-bold text-gray-900">StudioFlow</h1>
                <p class="text-sm text-gray-500 mt-1">Photography Studio Management</p>
            </div>

            {% if form.errors %}
            <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700">
                Invalid email or password. Please try again.
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div class="space-y-1.5">
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="username" id="id_username" required autofocus
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition"
                           placeholder="you@example.com">
                </div>
                <div class="space-y-1.5">
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" id="id_password" required
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 focus:bg-white transition"
                           placeholder="Enter your password">
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" class="h-4 w-4 text-brand-600 border-gray-300 rounded focus:ring-brand-500/20">
                        Remember me
                    </label>
                    <a href="#" class="text-sm text-brand-600 hover:text-brand-500">Forgot password?</a>
                </div>
                <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 bg-brand-600 text-white px-6 py-3 rounded-xl hover:bg-brand-700 transition-all text-sm font-medium shadow-sm shadow-brand-600/25">
                    Sign in
                </button>
            </form>
        </div>
        <p class="text-center text-xs sm:text-sm text-gray-500 mt-6">&copy; 2026 StudioFlow. All rights reserved.</p>
    </div>
</body>
</html>
