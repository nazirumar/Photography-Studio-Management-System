{% extends "base.html" %}
{% block title %}Create Contract - StudioFlow{% endblock %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">Create Contract</h1>
        <p class="text-gray-500 mt-1">For booking {{ booking.reference }} - {{ booking.client }}</p>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 p-6">
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Contract Terms</label>
                <textarea name="terms" rows="20" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm font-mono">{{ default_terms }}</textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="bg-brand-600 text-white px-5 py-2.5 rounded-xl hover:bg-brand-700 text-sm font-medium">Create Contract</button>
                <a href="{% url 'bookings:detail' pk=booking.pk %}" class="px-5 py-2.5 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50 text-sm font-medium">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
