<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - StudioFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gray-50 flex items-center justify-center">
    <div class="w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600">StudioFlow</h1>
            <p class="text-gray-500 mt-2">Client Portal</p>
        </div>
        <div class="bg-white rounded-xl border border-gray-200 p-8">
            <p class="text-center text-gray-600 mb-6">Sign in with your studio account to access the client portal.</p>
            <a href="{% url 'accounts:login' %}?next=/portal/" class="block w-full bg-indigo-600 text-white text-center py-3 rounded-lg hover:bg-indigo-700 font-medium">Sign In</a>
        </div>
    </div>
</body>
</html>
