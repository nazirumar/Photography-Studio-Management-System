{% extends "portal/base_portal.html" %}
{% block title %}My Profile - StudioFlow{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-gray-900">My Profile</h1>
        <p class="text-sm text-gray-500 mt-1">Manage your account settings</p>
    </div>

    <form method="post" class="bg-white rounded-2xl border border-gray-200 p-6 space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
            <input type="email" value="{{ client_user.email }}" disabled class="w-full px-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm text-gray-500 cursor-not-allowed">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">First Name</label>
                {{ form.first_name }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Last Name</label>
                {{ form.last_name }}
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1.5">Phone</label>
            {{ form.phone }}
        </div>
        <button type="submit" class="bg-brand-600 text-white px-6 py-2.5 rounded-xl hover:bg-brand-700 transition text-sm font-medium">Save Changes</button>
    </form>
</div>
{% endblock %}
