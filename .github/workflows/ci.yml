name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: studioflow_test
          POSTGRES_USER: studioflow
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Install dependencies
        run: uv sync --all-extras
        
      - name: Run Ruff linter
        run: uv run ruff check .
        
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
          DATABASE_URL: postgres://studioflow:testpass@localhost:5432/studioflow_test
        run: uv run python -m pytest --tb=short -q
        
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: uv run python manage.py check
        
      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: uv run python manage.py makemigrations --check --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploy to production server via SSH or Docker"
          echo "Configure DEPLOY_KEY, DEPLOY_HOST, DEPLOY_USER secrets"
